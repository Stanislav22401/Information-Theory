# Развёртывание статического сайта Information-Theory
# Домен: it.troshin.by (только HTTP)
#
# Установка (пример):
#   sudo cp deploy/nginx/it.troshin.by.conf /etc/nginx/sites-available/it.troshin.by
#   sudo ln -sf /etc/nginx/sites-available/it.troshin.by /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Корень сайта — каталог репозитория (с index.html в корне):
#   root /var/www/information-theory;

server {
    listen 80;
    listen [::]:80;

    server_name it.troshin.by;

    root /var/www/information-theory;
    index index.html;

    charset utf-8;

    access_log /var/log/nginx/it.troshin.by.access.log;
    error_log  /var/log/nginx/it.troshin.by.error.log warn;

    location / {
        try_files $uri $uri/ =404;
    }

    # ES-модули lab01 (app.js, crypto/*.js)
    location ~* \.js$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    location ~* \.css$ {
        default_type text/css;
        try_files $uri =404;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
        try_files $uri =204;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
        try_files $uri =404;
    }

    # Запрет доступа к служебным файлам при случайном копировании всего репозитория
    location ~ /\.(git|env) {
        deny all;
        return 404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json;
}
