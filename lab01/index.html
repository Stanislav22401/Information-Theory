<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лабораторная 1 — Вариант 10</title>
  <link rel="stylesheet" href="../css/site.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="site-nav" aria-label="Навигация">
    <a class="site-nav__home" href="../">Главная</a>
    <span class="site-nav__title">Лабораторная 1</span>
    <div class="site-nav__links">
      <a href="../lab01/" class="is-active" aria-current="page">Лаб. 1</a>
      <a href="../lab02/">Лаб. 2</a>
      <a href="../lab03/">Лаб. 3</a>
      <a href="../lab04/">Лаб. 4</a>
    </div>
  </nav>

  <main>
    <section class="panel settings">
      <h2>Параметры</h2>
      <div class="grid">
        <label>
          Алгоритм
          <select id="algorithm">
            <option value="columnar">Столбцовый метод (2 ключа)</option>
            <option value="vigenere">Виженер (самогенерирующийся ключ)</option>
          </select>
        </label>
        <label>
          Режим
          <select id="mode">
            <option value="encrypt">Шифрование</option>
            <option value="decrypt">Дешифрование</option>
          </select>
        </label>
      </div>

      <div id="keys-columnar" class="keys-block">
        <label>
          Ключевое слово 1
          <input type="text" id="key1" placeholder="например: ключ" autocomplete="off">
        </label>
        <label>
          Ключевое слово 2
          <input type="text" id="key2" placeholder="например: шифр" autocomplete="off">
        </label>
      </div>

      <div id="keys-vigenere" class="keys-block hidden">
        <label>
          Начальный ключ
          <input type="text" id="key-vigenere" placeholder="например: тайна" autocomplete="off">
        </label>
      </div>

      <p class="hint">Учитываются только буквы русского алфавита (А–Я, Ё). Остальные символы игнорируются.</p>
    </section>

    <section class="panel io">
      <h2>Текст</h2>
      <label>
        Исходный текст
        <textarea id="input-text" rows="8" placeholder="Введите текст или загрузите файл…"></textarea>
      </label>
      <div class="actions">
        <label class="file-btn">
          Загрузить файл
          <input type="file" id="file-input" accept=".txt,.text,text/plain">
        </label>
        <button type="button" id="btn-process" class="primary">Выполнить</button>
        <button type="button" id="btn-clear">Очистить</button>
      </div>
      <label>
        Результат
        <textarea id="output-text" rows="8" readonly placeholder="Результат появится здесь…"></textarea>
      </label>
      <div class="actions">
        <button type="button" id="btn-download" disabled>Сохранить в файл</button>
        <button type="button" id="btn-copy" disabled>Копировать результат</button>
      </div>
      <p id="status" class="status" role="status"></p>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
